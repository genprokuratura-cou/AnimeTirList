<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON DIMENSION — 3D Tier List</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.0.2/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.0.2/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5.0.2/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.2/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.2/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/rubik@5.0.2/700.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.min.js"></script>
<script src="https://unpkg.com/vanilla-tilt@1.8.0/dist/vanilla-tilt.min.js"></script>
<style>
:root{--bg:#0a0510;--panel:rgba(20,10,35,0.85);--s-color:#ffd75e;--a-color:#ff2fd6;--b-color:#00f0ff;--c-color:#45ff9c;--d-color:#ff5470;--txt:#f5ecdf}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Rubik',sans-serif;min-height:100vh;overflow-x:hidden;perspective:1500px}
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.tier-nav{position:fixed;top:50%;left:30px;transform:translateY(-50%);z-index:1000;display:flex;flex-direction:column;gap:20px;padding:25px 15px;border-radius:30px;background:rgba(10,5,20,0.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);box-shadow:0 0 40px rgba(0,240,255,0.2)}
.tier-nav-btn{width:60px;height:60px;border-radius:16px;border:none;cursor:pointer;font-family:'Unbounded',sans-serif;font-weight:900;font-size:22px;transition:all 0.5s cubic-bezier(0.23,1,0.32,1);background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7)}
.tier-nav-btn:hover{transform:scale(1.2) rotateY(15deg) rotateX(10deg);box-shadow:0 15px 40px rgba(0,240,255,0.4)}
.tier-nav-btn.S:hover,.tier-nav-btn.S.active{background:rgba(255,215,94,0.2);border-color:var(--s-color);color:var(--s-color);box-shadow:0 0 30px var(--s-color)}
.tier-nav-btn.A:hover,.tier-nav-btn.A.active{background:rgba(255,47,214,0.2);border-color:var(--a-color);color:var(--a-color);box-shadow:0 0 30px var(--a-color)}
.tier-nav-btn.B:hover,.tier-nav-btn.B.active{background:rgba(0,240,255,0.2);border-color:var(--b-color);color:var(--b-color);box-shadow:0 0 30px var(--b-color)}
.tier-nav-btn.C:hover,.tier-nav-btn.C.active{background:rgba(69,255,156,0.2);border-color:var(--c-color);color:var(--c-color);box-shadow:0 0 30px var(--c-color)}
.tier-nav-btn.D:hover,.tier-nav-btn.D.active{background:rgba(255,84,112,0.2);border-color:var(--d-color);color:var(--d-color);box-shadow:0 0 30px var(--d-color)}
.container{max-width:1400px;margin:0 auto;padding:60px 20px 100px}
.header{text-align:center;margin-bottom:60px;padding:40px;background:var(--panel);backdrop-filter:blur(20px);border-radius:30px;border:1px solid rgba(255,255,255,0.1)}
.header h1{font-family:'Unbounded',sans-serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:900;background:linear-gradient(135deg,#fff3c4,#ffd75e,#e0a92e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.tier-row{display:flex;margin-bottom:25px;border-radius:20px;overflow:hidden;background:var(--panel);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);opacity:0;transform:translateY(50px);transition:all 0.6s ease}
.tier-row.visible{opacity:1;transform:translateY(0)}
.tier-row:hover{transform:translateY(-5px) scale(1.02)}
.tier-label{width:140px;min-width:140px;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-size:2.5rem;font-weight:900}
.tier-row.S .tier-label{background:linear-gradient(135deg,#ffd75e,#e0a92e);color:#1a0f00}
.tier-row.A .tier-label{background:linear-gradient(135deg,#ff2fd6,#c218a3);color:#fff}
.tier-row.B .tier-label{background:linear-gradient(135deg,#00f0ff,#00a8cc);color:#000}
.tier-row.C .tier-label{background:linear-gradient(135deg,#45ff9c,#2db86f);color:#000}
.tier-row.D .tier-label{background:linear-gradient(135deg,#ff5470,#cc2f4a);color:#fff}
.tier-content{flex:1;display:flex;flex-wrap:wrap;align-items:center;padding:15px;gap:12px;min-height:120px}
.char-card{width:100px;height:120px;border-radius:15px;background:rgba(255,255,255,0.08);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;transition:all 0.4s}
.char-card:hover{transform:translateY(-10px) scale(1.1);box-shadow:0 20px 40px rgba(0,0,0,0.5);z-index:100}
.char-card img{width:70px;height:70px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.char-card span{font-size:0.75rem;font-weight:600;text-align:center}
.controls{display:flex;justify-content:center;gap:15px;margin-bottom:40px;flex-wrap:wrap}
.btn{padding:14px 28px;border-radius:12px;border:none;font-family:'Unbounded',sans-serif;font-weight:700;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));color:var(--txt);border:1px solid rgba(255,255,255,0.2);transition:all 0.4s}
.btn:hover{transform:translateY(-3px) scale(1.05);background:rgba(255,255,255,0.25)}
.btn-primary{background:linear-gradient(135deg,#ffd75e,#e0a92e);color:#1a0f00}
.dragging{opacity:0.5}.drag-over{background:rgba(255,255,255,0.15);border:2px dashed rgba(255,255,255,0.5)}
.hidden-input{display:none}
.scroll-progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--s-color),var(--a-color),var(--b-color),var(--c-color),var(--d-color));z-index:2000;width:0%}
.cursor-glow{position:fixed;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,0.15) 0%,transparent 70%);pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
@media(max-width:768px){.tier-nav{top:auto;bottom:20px;left:50%;transform:translateX(-50%);flex-direction:row}.tier-nav-btn{width:50px;height:50px;font-size:18px}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="scroll-progress" id="scrollProgress"></div>
<nav class="tier-nav" id="tierNav"></nav>
<div class="container">
<header class="header" data-tilt data-tilt-max="5" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.3">
<h1>NEON DIMENSION</h1>
<p>Интерактивный 3D рейтинг персонажей</p>
</header>
<div class="controls">
<button class="btn btn-primary" onclick="addRandomCharacter()">🎲 Случайный</button>
<button class="btn" onclick="document.getElementById('fileInput').click()">📁 Импорт</button>
<button class="btn" onclick="exportData()">💾 Экспорт</button>
<button class="btn" onclick="clearAll()">🗑️ Очистить</button>
<input type="file" id="fileInput" class="hidden-input" accept=".json" onchange="importData(event)">
</div>
<div id="tierList"></div>
</div>
<script>
const TIERS=[{key:'S',name:'Легендарные',color:'#ffd75e'},{key:'A',name:'Эпические',color:'#ff2fd6'},{key:'B',name:'Редкие',color:'#00f0ff'},{key:'C',name:'Обычные',color:'#45ff9c'},{key:'D',name:'Базовые',color:'#ff5470'}];
let characters={S:[],A:[],B:[],C:[],D:[]},activeTier='ALL',draggedElement=null,sourceTier=null,sourceIndex=null;

(function initThreeJS(){
const canvas=document.getElementById('bgCanvas'),renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.z=40;
const COUNT=1200,geo=new THREE.BufferGeometry(),pos=new Float32Array(COUNT*3),col=new Float32Array(COUNT*3),spd=new Float32Array(COUNT);
const palette=[new THREE.Color(0xffd75e),new THREE.Color(0xff2fd6),new THREE.Color(0x00f0ff),new THREE.Color(0x45ff9c),new THREE.Color(0xff5470)];
for(let i=0;i<COUNT;i++){pos[i*3]=(Math.random()-.5)*150;pos[i*3+1]=(Math.random()-.5)*100;pos[i*3+2]=(Math.random()-.5)*80;spd[i]=.01+Math.random()*.04;const c=palette[Math.floor(Math.random()*palette.length)];col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;}
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:.5,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending})));
const mk=(g,c,x,y,z)=>{const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:.15}));m.position.set(x,y,z);scene.add(m);return m;};
const shapes=[mk(new THREE.TorusKnotGeometry(5,1.5,100,16),0xffd75e,20,10,-20),mk(new THREE.IcosahedronGeometry(5,0),0xff2fd6,-20,-10,-15),mk(new THREE.OctahedronGeometry(4,0),0x00f0ff,-18,12,-25)];
let mx=0,my=0,t=0;
addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*2;my=(e.clientY/innerHeight-.5)*2;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function animate(){requestAnimationFrame(animate);t+=.003;const p=geo.attributes.position.array;for(let i=0;i<COUNT;i++){p[i*3+1]-=spd[i];if(p[i*3+1]<-50)p[i*3+1]=50;}geo.attributes.position.needsUpdate=true;shapes.forEach((s,i)=>{s.rotation.x+=.004*(i+1);s.rotation.y+=.005*(i+1);s.position.y+=Math.sin(t*(i+1))*0.5;});camera.position.x+=(mx*8-camera.position.x)*.03;camera.position.y+=(-my*5-camera.position.y)*.03;camera.lookAt(scene.position);renderer.render(scene,camera);})();
})();

const cursorGlow=document.getElementById('cursorGlow');
addEventListener('mousemove',e=>{cursorGlow.style.left=e.clientX+'px';cursorGlow.style.top=e.clientY+'px';});
const scrollProgress=document.getElementById('scrollProgress');
addEventListener('scroll',()=>{scrollProgress.style.width=(window.scrollY/(document.body.scrollHeight-window.innerHeight))*100+'%';});

function renderTierNav(){
const nav=document.getElementById('tierNav');nav.innerHTML='';
const allBtn=document.createElement('button');allBtn.className='tier-nav-btn'+(activeTier==='ALL'?' active':'');allBtn.textContent='🌐';allBtn.onclick=()=>switchTier('ALL');nav.appendChild(allBtn);
TIERS.forEach(t=>{const btn=document.createElement('button');btn.className='tier-nav-btn '+t.key+(activeTier===t.key?' active':'');btn.textContent=t.key;btn.onclick=()=>switchTier(t.key);VanillaTilt.init(btn,{max:15,speed:400,glare:true,'max-glare':0.3});nav.appendChild(btn);});
}

function switchTier(tier){activeTier=tier;renderTierNav();render();if(tier!=='ALL'){const target=document.querySelector('.tier-row.t-'+tier);if(target)target.scrollIntoView({behavior:'smooth',block:'center'});}}

function render(){
const container=document.getElementById('tierList');container.innerHTML='';
TIERS.forEach(tier=>{if(activeTier!=='ALL'&&activeTier!==tier.key)return;
const row=document.createElement('div');row.className='tier-row t-'+tier.key;
const label=document.createElement('div');label.className='tier-label';label.textContent=tier.key;
const content=document.createElement('div');content.className='tier-content';content.dataset.tier=tier.key;
content.addEventListener('dragover',e=>{e.preventDefault();content.classList.add('drag-over');});
content.addEventListener('dragleave',()=>content.classList.remove('drag-over'));
content.addEventListener('drop',e=>{e.preventDefault();content.classList.remove('drag-over');if(!draggedElement)return;const char=characters[sourceTier][sourceIndex];characters[sourceTier].splice(sourceIndex,1);characters[tier.key].push(char);render();saveData();});
characters[tier.key].forEach((char,idx)=>{const card=createCharCard(char,tier.key,idx);content.appendChild(card);});
row.appendChild(label);row.appendChild(content);container.appendChild(row);});
observeElements();setTimeout(()=>{document.querySelectorAll('.char-card').forEach(c=>VanillaTilt.init(c,{max:10,speed:300}));},100);
}

function createCharCard(char,tier,index){
const card=document.createElement('div');card.className='char-card';card.draggable=true;card.dataset.index=index;card.dataset.tier=tier;
const img=document.createElement('img');img.src=char.image||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23333" width="100" height="100"/><text x="50" y="55" text-anchor="middle" fill="%23666" font-size="40">?</text></svg>';img.style.width='70px';img.style.height='70px';img.style.borderRadius='10px';
const name=document.createElement('span');name.textContent=char.name;name.style.fontSize='0.75rem';
card.appendChild(img);card.appendChild(name);
card.addEventListener('dragstart',function(){draggedElement=this;sourceTier=this.dataset.tier;sourceIndex=parseInt(this.dataset.index);this.classList.add('dragging');});
card.addEventListener('dragend',function(){this.classList.remove('dragging');draggedElement=null;sourceTier=null;sourceIndex=null;});
return card;
}

function addRandomCharacter(){const names=['Наруто','Гоку','Луффи','Зоро','Леви','Эрен','Микаса','Саске','Какаши','Итачи'];const tier=TIERS[Math.floor(Math.random()*TIERS.length)].key;characters[tier].push({name:names[Math.floor(Math.random()*names.length)],image:'https://via.placeholder.com/100/'+tier.replace('#','')+'?text='+tier});render();saveData();confetti({particleCount:100,spread:70,origin:{y:0.6}});}
function clearAll(){if(confirm('Очистить всё?')){characters={S:[],A:[],B:[],C:[],D:[]};render();saveData();}}
function exportData(){const blob=new Blob([JSON.stringify(characters,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tier-list.json';a.click();}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{characters=JSON.parse(ev.target.result);render();saveData();alert('Импорт успешен!');}catch(err){alert('Ошибка импорта');}};reader.readAsText(file);}
function saveData(){localStorage.setItem('neonTierList',JSON.stringify(characters));}
function loadData(){const s=localStorage.getItem('neonTierList');if(s)try{characters=JSON.parse(s);}catch(e){}}
function observeElements(){const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});},{threshold:0.1});document.querySelectorAll('.tier-row').forEach(r=>obs.observe(r));}

loadData();render();renderTierNav();
</script>
</body>
</html>
